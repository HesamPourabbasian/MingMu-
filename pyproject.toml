[tool.poetry]
name = "mingmu"
version = "2.0.0"
description = "明眸 MingMu — Professional System Health Monitor for macOS, Linux & Windows"
authors = ["Hesam Pourabbasain"]
readme = "README.md"
license = "MIT"
keywords = ["system-monitor", "cli", "battery", "cpu", "ram", "disk", "network", "telemetry", "health-check"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
packages = [{include = "mingmu"}]

[tool.poetry.dependencies]
python = "^3.10"
colorama = "^0.4.6"
psutil = ">=5.9,<7.0"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"

[tool.poetry.scripts]
mingmu = "mingmu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
